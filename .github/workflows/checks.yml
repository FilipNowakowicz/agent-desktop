name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install desktop runtime
        run: sudo apt-get update && sudo apt-get install -y labwc foot grim wayvnc wlr-randr dbus-daemon xwayland xterm zenity x11-utils fonts-dejavu-core
      - name: Record runtime versions
        run: dpkg-query -W labwc foot grim wayvnc wlr-randr dbus-daemon xwayland xterm zenity
      - run: uv sync --locked --managed-python
      - name: Check Python source
        run: |
          uv run ruff check src scripts tests benchmarks
          uv run ruff format --check src scripts tests benchmarks
          uv run python -m compileall -q src scripts tests benchmarks
      - name: Run routing and headless compositor tests
        run: uv run python -m unittest discover -s tests -v
        env:
          DESKTOP_TEST_ARTIFACTS: ${{ runner.temp }}/desktop-tests
      - name: Repeat immediate typing after focus switches
        run: |
          uv run python - <<'PY'
          import sys
          import unittest
          sys.path.insert(0, "tests")
          name = "test_runtime.RuntimeTests.test_immediate_typing_after_repeated_focus_switches"
          suite = unittest.TestSuite(
              unittest.defaultTestLoader.loadTestsFromName(name) for _ in range(10)
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(not result.wasSuccessful())
          PY
        env:
          DESKTOP_TEST_ARTIFACTS: ${{ runner.temp }}/desktop-tests
      - name: Keep test desktops on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tests-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/desktop-tests
          retention-days: 7
      - name: Repeat lifecycle under CPU load
        run: uv run scripts/lifecycle_stress.py --cycles 5 --load 2
  distributions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:latest
            install: >-
              dnf install -y --setopt=install_weak_deps=False git tar gzip
              labwc foot grim wayvnc wlr-randr dbus-daemon xorg-x11-server-Xwayland
              xterm xev zenity chromium dejavu-sans-fonts dejavu-sans-mono-fonts
            versions: rpm -q labwc foot grim wayvnc wlr-randr dbus-daemon xorg-x11-server-Xwayland xterm zenity
          - name: arch
            image: archlinux:latest
            install: >-
              pacman -Syu --noconfirm git labwc foot grim wayvnc wlr-randr dbus
              xorg-xwayland xterm xorg-xev zenity chromium ttf-dejavu
            versions: pacman -Q labwc foot grim wayvnc wlr-randr dbus xorg-xwayland xterm zenity
    name: runtime (${{ matrix.name }})
    container: ${{ matrix.image }}
    env:
      XDG_RUNTIME_DIR: /tmp/runtime
    steps:
      - name: Create a user runtime directory
        run: mkdir -m 700 -p /tmp/runtime
      - name: Install desktop runtime
        run: ${{ matrix.install }}
      - name: Record runtime versions
        run: ${{ matrix.versions }}
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --managed-python
      - name: Run routing and headless compositor tests
        run: uv run python -m unittest discover -s tests -v
        env:
          DESKTOP_TEST_ARTIFACTS: ${{ runner.temp }}/desktop-tests
      - name: Keep test desktops on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tests-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/desktop-tests
          retention-days: 7
      - name: Repeat lifecycle under CPU load
        run: uv run scripts/lifecycle_stress.py --cycles 5 --load 2
