name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install desktop runtime
        run: sudo apt-get update && sudo apt-get install -y labwc foot grim wtype wlrctl dbus-x11 fonts-dejavu-core
      - run: uv sync --locked --managed-python
      - name: Check Python source
        run: |
          uv run ruff check src scripts tests
          uv run ruff format --check src scripts tests
          uv run python -m compileall -q src scripts tests
      - name: Run routing and headless compositor tests
        run: uv run python -m unittest discover -s tests -v
