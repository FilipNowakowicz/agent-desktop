name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install desktop runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends labwc foot grim wayvnc wlr-randr dbus-daemon xwayland xterm zenity mousepad libreoffice-writer libreoffice-calc libreoffice-gtk3 x11-utils xfonts-base fonts-dejavu-core
      - name: Record runtime versions
        run: dpkg-query -W labwc foot grim wayvnc wlr-randr dbus-daemon xwayland xterm zenity mousepad libreoffice-writer libreoffice-calc
      - run: uv sync --locked --managed-python
      - name: Check Python source
        run: |
          uv run ruff check src scripts tests benchmarks
          uv run ruff format --check src scripts tests benchmarks
          uv run python -m compileall -q src scripts tests benchmarks
      - name: Run routing and headless compositor tests
        run: uv run python -m unittest discover -s tests -v
        env:
          DESKTOP_TEST_DEBUG: 1
          DESKTOP_TEST_ARTIFACTS: ${{ runner.temp }}/desktop-tests
      - name: Repeat focus switching, Xwayland input and supervisor crash cleanup
        run: |
          uv run python - <<'PY'
          import sys
          import unittest
          sys.path.insert(0, "tests")
          names = [
              "test_runtime.RuntimeTests.test_immediate_typing_after_repeated_focus_switches",
              "test_runtime.RuntimeTests.test_killed_supervisor_is_cleaned_up_by_guardian",
              "test_runtime.RuntimeTests.test_xwayland_application_receives_input",
          ]
          suite = unittest.TestSuite(
              unittest.defaultTestLoader.loadTestsFromName(name)
              for _ in range(10) for name in names
          )
          result = unittest.TextTestRunner(verbosity=2, failfast=True).run(suite)
          sys.exit(not result.wasSuccessful())
          PY
        env:
          DESKTOP_TEST_DEBUG: 1
          DESKTOP_TEST_ARTIFACTS: ${{ runner.temp }}/desktop-tests
      - name: Keep test desktops on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tests-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/desktop-tests
          retention-days: 7
      - name: Repeat lifecycle under CPU load
        run: uv run scripts/lifecycle_stress.py --cycles 5 --load 2
  distributions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:latest
            install: >-
              dnf install -y --setopt=install_weak_deps=False git tar gzip
              labwc foot grim wayvnc wlr-randr dbus-daemon xorg-x11-server-Xwayland
              xterm xev xprop xwininfo zenity mousepad chromium libreoffice-writer libreoffice-calc
              libreoffice-gtk3 dejavu-sans-fonts dejavu-sans-mono-fonts
              wlroots0.19-devel gcc gcc-c++ meson ninja-build curl-minimal patchelf patch
              glslang glslang-devel wayland-protocols-devel hwdata-devel
            versions: rpm -q labwc foot grim wayvnc wlr-randr dbus-daemon xorg-x11-server-Xwayland xterm zenity mousepad libreoffice-writer libreoffice-calc
          - name: arch
            image: archlinux:latest
            install: >-
              pacman -Syu --noconfirm git labwc foot grim wayvnc wlr-randr dbus
              xorg-xwayland xterm xorg-xev xorg-xprop xorg-xwininfo zenity mousepad chromium libreoffice-fresh ttf-dejavu
              base-devel meson ninja curl patchelf glslang vulkan-headers hwdata
            versions: pacman -Q labwc foot grim wayvnc wlr-randr dbus xorg-xwayland xterm zenity mousepad libreoffice-fresh
    name: runtime (${{ matrix.name }})
    container: ${{ matrix.image }}
    env:
      XDG_RUNTIME_DIR: /tmp/runtime
    steps:
      - name: Create a user runtime directory
        run: mkdir -m 700 -p /tmp/runtime
      - name: Install desktop runtime
        run: ${{ matrix.install }}
      - name: Record runtime versions
        run: ${{ matrix.versions }}
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --managed-python
      - name: Build a private Xwayland mapping repair
        run: |
          sh scripts/build_xwayland_runtime.sh "$RUNNER_TEMP/private-runtime"
          ldd "$RUNNER_TEMP/private-runtime/install/bin/labwc" > "$RUNNER_TEMP/private-runtime/libraries.txt"
          cat "$RUNNER_TEMP/private-runtime/libraries.txt"
          resolved=$(awk '$1 ~ /^libwlroots-0\.(19|20)\.so$/ {print $3}' "$RUNNER_TEMP/private-runtime/libraries.txt")
          test "$(dirname "$(realpath "$resolved")")" = "$RUNNER_TEMP/private-runtime/install/lib"
          echo "$RUNNER_TEMP/private-runtime/install/bin" >> "$GITHUB_PATH"
      - name: Run routing and headless compositor tests
        run: uv run python -m unittest discover -s tests -v
        env:
          DESKTOP_TEST_DEBUG: 1
          DESKTOP_TEST_ARTIFACTS: ${{ runner.temp }}/desktop-tests
      - name: Repeat Xwayland mapping and input under CPU load
        run: |
          uv run python - <<'PY'
          import subprocess
          import sys
          import unittest
          sys.path.insert(0, "tests")
          name = "test_runtime.RuntimeTests.test_xwayland_application_receives_input"
          suite = unittest.TestSuite(
              unittest.defaultTestLoader.loadTestsFromName(name)
              for _ in range(100)
          )
          load = []
          try:
              for _ in range(4):
                  load.append(subprocess.Popen([sys.executable, "-c", "while True: pass"]))
              result = unittest.TextTestRunner(verbosity=2, failfast=True).run(suite)
          finally:
              for child in load:
                  child.terminate()
              for child in load:
                  child.wait()
          sys.exit(not result.wasSuccessful())
          PY
        env:
          DESKTOP_TEST_DEBUG: 1
          DESKTOP_TEST_ARTIFACTS: ${{ runner.temp }}/desktop-tests
      - name: Keep test desktops on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tests-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/desktop-tests
          retention-days: 7
      - name: Repeat lifecycle under CPU load
        run: uv run scripts/lifecycle_stress.py --cycles 5 --load 2
